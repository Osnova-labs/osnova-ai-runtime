    devDependencies:
      '@types/node':
        specifier: ^22.10.7
        version: 22.19.21
      typescript:
        specifier: ^5.7.3
        version: 5.9.3

  ../osnova-core/packages/manifest:
    dependencies:
      '@osnova/types':
        specifier: workspace:0.2.0
        version: link:../types

