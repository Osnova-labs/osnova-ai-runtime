      '@osnova/plugin-sdk':
        specifier: file:../osnova-plugin-sdk
        version: link:../osnova-plugin-sdk
      '@osnova/project':
        specifier: file:../osnova-core/packages/project
        version: file:../osnova-core/packages/project
      '@osnova/types':
        specifier: file:../osnova-core/packages/types
        version: link:../osnova-core/packages/types
      '@osnova/validation':
        specifier: file:../osnova-core/packages/validation
