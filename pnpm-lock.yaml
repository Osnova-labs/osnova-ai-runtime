      '@types/node':
        specifier: ^22.10.7
        version: 22.19.21
      typescript:
        specifier: ^5.7.3
        version: 5.9.3

packages:

  '@osnova/manifest@file:../osnova-core/packages/manifest':
    resolution: {directory: ../osnova-core/packages/manifest, type: directory}

  '@osnova/project@file:../osnova-core/packages/project':
    resolution: {directory: ../osnova-core/packages/project, type: directory}

  '@osnova/validation@file:../osnova-core/packages/validation':
